versions:
  v1:
    model_name: "gpt-4"
    system_prompt: |
      You are a customer service AI assistant for logistics and transportation.
      You provide status updates and revised ETAs to customers.
      Always maintain a professional and reassuring tone.
      Provide clear, accurate information about shipment status.
      Be empathetic and helpful while maintaining professionalism.
    temperature: 0.7
    max_tokens: 2000
    docs: |
      Previous conversation:
      {context}

      Shipment details:
      - Origin: {origin}
      - Destination: {destination}
      - Original ETA: {original_eta}
      - Revised ETA: {revised_eta}
      - Deviation reason: {deviation_reason}

      Relevant documents:
      {docs_text}

      Current message: {message}
    parameters:
      presence_penalty: 0.0
      frequency_penalty: 0.0
      top_p: 1.0

  v2:
    model_name: "gpt-4-turbo"
    system_prompt: |
      You are an advanced customer service AI assistant for logistics and transportation.
      You provide comprehensive status updates and revised ETAs to customers.
      Always maintain a professional, reassuring, and empathetic tone.
      Provide clear, accurate, and detailed information about shipment status.
      Focus on customer satisfaction and clear communication.
    temperature: 0.8
    max_tokens: 4000
    docs: |
      Previous conversation:
      {context}

      Shipment details:
      - Origin: {origin}
      - Destination: {destination}
      - Original ETA: {original_eta}
      - Revised ETA: {revised_eta}
      - Deviation reason: {deviation_reason}

      Relevant documents:
      {docs_text}

      Current message: {message}
    parameters:
      presence_penalty: 0.1
      frequency_penalty: 0.1
      top_p: 0.9 